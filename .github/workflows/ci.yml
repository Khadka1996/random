name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '17 4 * * 1' # every Monday: prove every card still demonstrates its point

jobs:
  prove:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [18, 20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Unit and property tests
        run: npm test
      - name: Verify every card (break violates, fix holds, deterministic)
        run: node bin/proofbook.js verify
